function parse(raw){

async function recog(file){const ps=$('ps'),key=$('ak').value.trim();ps.className='k';ps.textContent='正在识别题目和几何图…';$('pls').innerHTML='';
 try{const url=await shrink(file);$('pv').src=url;$('pv').hidden=false;
  const r=await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify({model:$('md').value.trim()||'glm-4.1v-thinking-flash',max_tokens:8192,messages:[{role:'user',content:[{type:'image_url',image_url:{url:url}},{type:'text',text:SYS+'\n\n请识别图片里的题目和几何图，按要求输出JSON数组。'}]}]})});
  const j=await r.json();if(!r.ok)throw Error((j.error&&j.error.message)||('请求失败 '+r.status));
  let tx=(j.choices&&j.choices[0]&&j.choices[0].message.content)||'';const bx=tx.match(/<\|begin_of_box\|>([\s\S]*?)<\|end_of_box\|>/);if(bx)tx=bx[1];
  const m=tx.match(/\[\s*\{[\s\S]*\}\s*\]/);if(!m)throw Error('没有识别到题目');const L=JSON.parse(m[0]);
  ps.textContent='识别到 '+L.length+' 个问题。点任意一个即可求解，也可以先在文本框里改一改再点“生成并演示”：';
  L.forEach(q=>{const b=document.createElement('button');b.textContent=q.title+'：'+q.text;b.onclick=()=>{$('tx').value=q.text;run()};$('pls').append(b)});if(L[0]){$('tx').value=L[0].text;run()}
 }catch(e){ps.className='e';ps.textContent='识别失败：'+e.message+(key?'':'（还没填 API Key：展开下方“识图设置”填入后再试）')}}
$('f1').onchange=$('f2').onchange=e=>{const f=e.target.files[0];if(f)recog(f);e.target.value=''};
// 平移、缩放
let dg=null;const zoom=(k,cx=W/2,cy=H/2)=>{const wx=(cx-W/2-V.ox)/V.sc,wy=(H/2+V.oy-cy)/V.sc;V.sc*=k;V.ox=cx-W/2-wx*V.sc;V.oy=cy-H/2+wy*V.sc;V.set=1;draw()};
cv.onpointerdown=e=>{dg=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=e=>{if(!dg)return;V.ox+=e.clientX-dg[0];V.oy+=e.clientY-dg[1];dg=[e.clientX,e.clientY];V.set=1;draw()};
cv.onpointerup=()=>{dg=null;cv.style.cursor='grab'};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)};
$('zi').onclick=()=>zoom(1.3);$('zo').onclick=()=>zoom(1/1.3);$('zf').onclick=()=>{if(S){V.set=0;fit();draw()}};
// 动画循环（沿弧长匀速；闭合曲线循环，开放曲线往返）
function loop(t){const dt=Math.min((t-last)/1000,.1);last=t;
 if(S&&play){u+=dir*dt*$('sp').value/8;if(S.path.closed)u=(u%1+1)%1;else if(u>=1){u=1;dir=-1}else if(u<=0){u=0;dir=1}$('pr').value=u*1000;draw()}
 requestAnimationFrame(loop)}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
run();requestAnimationFrame(loop);
</script></body></html>
